name: Docker Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  env:
  IMAGE_NAME: ghcr.io/klir-fh/dockertest-secure

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test || echo "No tests defined"

  build:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, linux, x64, prod-runner]
    environment: prod
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker pull $IMAGE_NAME@${{ needs.build.outputs.digest }}
      - run: docker stop bestapplication || true
      - run: docker rm bestapplication || true
      - run: docker run -d --name bestapplication -p 3000:3000 $IMAGE_NAME@${{ needs.build.outputs.digest }}
